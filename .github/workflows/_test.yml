name: "Test"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint the code.
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ env.NODE_VERSION }}-
            npm-${{ runner.os }}-
      - name: Clean install environment
        run: |
          rm -rf node_modules
          npm cache clean --force
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
  unit-test:
    runs-on: ubuntu-latest
    name: Run unit tests.
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ env.NODE_VERSION }}-
            npm-${{ runner.os }}-
      - name: Clean install environment
        run: |
          rm -rf node_modules
          npm cache clean --force
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
