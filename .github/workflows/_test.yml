name: "Test"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint the code.
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ env.NODE_VERSION }}-
            npm-${{ runner.os }}-
      - name: Clean install environment
        run: |
          rm -rf node_modules
          npm cache clean --force
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
  build:
    runs-on: ubuntu-latest
    name: Make sure the bundled dist/ is up to date.
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ env.NODE_VERSION }}-
            npm-${{ runner.os }}-
      - name: Clean install environment
        run: |
          rm -rf node_modules
          npm cache clean --force
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
      - name: Fail if dist/ is out of date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff dist
            exit 1
          fi
