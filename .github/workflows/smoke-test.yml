name: Smoke Test

# Runs the action from this checkout (`uses: ./`) against a locally served,
# deliberately tall page, then asserts the mobile screenshots are viewport
# sized rather than full-page. This guards the bug that motivated the fork: an
# emulated device with `fullPage: false` must NOT capture the whole scrollable
# page.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serve a tall test page (~10 viewports)
        run: |
          mkdir -p _fixture
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>smoke</title><style>section{height:100vh;display:flex;'
            echo 'align-items:center;justify-content:center;font:700 8vh sans-serif}</style>'
            for i in $(seq 1 10); do echo "<section>block $i</section>"; done
          } > _fixture/index.html
          nohup python3 -m http.server 8080 --directory _fixture >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 0.5
          done

      - name: Run the action (local)
        uses: ./
        with:
          url: http://localhost:8080/
          devices: iPhone 13,iPad Pro 11,iPad Pro 11 landscape
          noDesktop: true
          fullPage: false
          type: png

      - name: Assert viewport-sized screenshots (fullPage regression guard)
        run: |
          python3 - <<'PY'
          import glob, struct, sys

          files = sorted(glob.glob('screenshots/*.png'))
          if not files:
              sys.exit('FAIL: the action produced no screenshots')

          def size(path):
              with open(path, 'rb') as fh:
                  w, h = struct.unpack('>II', fh.read(24)[16:24])
              return w, h

          dims = {f: size(f) for f in files}
          for f, (w, h) in dims.items():
              print(f'{f}: {w}x{h}')

          # iPad Pro 11 portrait viewport is 834x1194 @2x = 1668x2388. The
          # fixture is ~10 viewports tall, so a full-page capture would be
          # >20000px.
          ipad = next((d for f, d in dims.items()
                       if '/iPad_Pro_11-' in '/' + f), None)
          if ipad is None:
              sys.exit('FAIL: no iPad Pro 11 portrait screenshot found')
          if ipad[1] >= 4000:
              sys.exit(f'FAIL: iPad Pro height {ipad[1]}px looks like a '
                       f'full-page capture — fullPage:false regressed')
          print('OK: mobile screenshots are viewport sized')
          PY

      - name: Serve a login fixture (pre-script scenario)
        run: |
          rm -f _login-requests.log
          nohup node .github/smoke-fixtures/login-server.js "$PWD/_login-requests.log" >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8081/login >/dev/null && break
            sleep 0.5
          done
          # The readiness probe is not part of the assertion.
          rm -f _login-requests.log

      - name: Run the action with a pre-script (login, desktop + device)
        uses: ./
        with:
          url: http://localhost:8081/
          devices: iPhone 13
          type: png
          preScriptPath: .github/smoke-fixtures/pre.mjs
          preScriptTimeout: 30000

      - name: Assert the login cookie reached desktop and device captures
        run: |
          test -f _login-requests.log || { echo 'FAIL: no server log'; exit 1; }
          cat _login-requests.log
          # Pre-script redirect + desktop capture + device capture = 3 requests
          # for "/", all of which must carry the session cookie.
          authed=$(grep -c '^GET / cookie=\[.*session=1.*\]$' _login-requests.log || true)
          anon=$(grep -c '^GET / cookie=\[\]$' _login-requests.log || true)
          echo "authenticated GET / requests: $authed, anonymous: $anon"
          [ "$authed" -ge 3 ] || { echo 'FAIL: expected >= 3 authenticated requests'; exit 1; }
          [ "$anon" -eq 0 ] || { echo 'FAIL: a capture ran without the session cookie'; exit 1; }
          ls screenshots/desktopPage*.png screenshots/iPhone_13-*.png >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: screenshots
          if-no-files-found: warn

  all-green:
    name: All checks green
    if: always()
    needs:
      - smoke
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job failed or was cancelled
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result=$r)."
              exit 1
            fi
          done
          echo "All jobs succeeded or were skipped."
