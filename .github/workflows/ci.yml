name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
      - edited

permissions: {}

jobs:
  test:
    if: github.event_name == 'push' || (github.base_ref == 'main' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml
    secrets: inherit

  lint-pr-title:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","edited","synchronize","reopened"]'), github.event.action)
    permissions:
      pull-requests: write
    uses: ./.github/workflows/_lint-pr-title.yml
    secrets: inherit

  fail-missing-pre-script:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_fail_missing-pre-script.yml

  fail-pre-script-error:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_fail_pre-script-error.yml

  fail-pre-script-timeout:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_fail_pre-script-timeout.yml

  fail-unknown-device:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_fail_unknown-device.yml

  pass-all-defaults:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_all-defaults.yml

  pass-devices:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_devices.yml

  pass-external-login-pre-script:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_external-login-pre-script.yml

  pass-full-page:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_full-page.yml

  pass-no-commit-hash-file-name:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_no-commit-hash-file-name.yml

  pass-no-desktop:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_no-desktop.yml

  pass-pre-script-login:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_pre-script-login.yml

  pass-release-pr-comment:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_pass_release-pr-comment.yml

  pass-type:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_type.yml

  pass-uses-external-url:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_uses-external-url.yml

  pass-wait-for-selector:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_wait-for-selector.yml

  pass-wait-until:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","closed"]'), github.event.action)
    permissions:
      contents: read
    uses: ./.github/workflows/_pass_wait-until.yml

  all-green:
    name: All checks green
    if: always()
    needs:
      - test
      - lint-pr-title
      - fail-missing-pre-script
      - fail-pre-script-error
      - fail-pre-script-timeout
      - fail-unknown-device
      - pass-all-defaults
      - pass-devices
      - pass-external-login-pre-script
      - pass-full-page
      - pass-no-commit-hash-file-name
      - pass-no-desktop
      - pass-pre-script-login
      - pass-release-pr-comment
      - pass-type
      - pass-uses-external-url
      - pass-wait-for-selector
      - pass-wait-until
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job failed or was cancelled
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result=$r)."
              exit 1
            fi
          done
          echo "All jobs succeeded or were skipped."
