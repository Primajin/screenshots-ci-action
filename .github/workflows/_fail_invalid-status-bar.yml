name: "Negative Test - invalid status bar"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fail:
    runs-on: ubuntu-latest
    name: "Should fail - an invalid time, battery, platform, theme or mode fails the action before any capture"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use a time that does not exist
        id: action
        continue-on-error: true
        uses: ./
        with:
          url: https://example.com
          devices: iPhone 13
          status-bar: ios
          status-bar-time: '25:61'
      - name: Check the step failed
        if: always()
        run: |
          if [ "${{ steps.action.outcome }}" == "failure" ]; then
            echo "The action failed as expected"
          else
            echo "::error::The action did not fail"
            exit 1
          fi
      - name: Check every kind of mistake fails with a clear message and captures nothing
        shell: bash
        env:
          INPUT_URL: https://example.com
          INPUT_DEVICES: iPhone 13
        run: |
          check() {
            local message="$1"
            shift
            if env "$@" node "$GITHUB_WORKSPACE/index.js" > action.log 2>&1; then
              cat action.log
              echo "::error::Expected a non-zero exit code for $*"
              exit 1
            fi
            cat action.log
            grep -qF -- "$message" action.log || { echo "::error::The message for $* should contain: $message"; exit 1; }
          }
          check 'Invalid status-bar-time "25:61"; use H:MM or HH:MM from 0:00 to 23:59' INPUT_STATUS-BAR=ios INPUT_STATUS-BAR-TIME=25:61
          check 'Invalid status-bar-time "9:5"' INPUT_STATUS-BAR=ios INPUT_STATUS-BAR-TIME=9:5
          check 'Invalid status-bar-battery "101"; use a whole number from 0 to 100.' INPUT_STATUS-BAR=ios INPUT_STATUS-BAR-BATTERY=101
          check 'Invalid status-bar-battery "full"' INPUT_STATUS-BAR=android INPUT_STATUS-BAR-BATTERY=full
          check 'Unknown status-bar "windows"; use none, ios, android.' INPUT_STATUS-BAR=windows
          check 'Unknown status-bar-theme "blue"; use auto, light, dark.' INPUT_STATUS-BAR=ios INPUT_STATUS-BAR-THEME=blue
          check 'Unknown status-bar-mode "float"; use strip, overlay.' INPUT_STATUS-BAR=ios INPUT_STATUS-BAR-MODE=float
          check 'Invalid status-bar-charging "yes"; use true or false.' INPUT_STATUS-BAR=ios INPUT_STATUS-BAR-CHARGING=yes
          # A typo in an option fails even without a status bar: it would otherwise stay hidden until it is switched on
          check 'Invalid status-bar-time "noon"' INPUT_STATUS-BAR=none INPUT_STATUS-BAR-TIME=noon
          test -z "$(ls screenshots 2>/dev/null)"
