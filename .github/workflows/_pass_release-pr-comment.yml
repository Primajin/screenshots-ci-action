name: "Positive Test - release upload and PR comment"

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

env:
  # Id of the long-lived CI pre-release that collects the screenshots of this
  # scenario (see README.ci.md for how to recreate it).
  CI_RELEASE_ID: '415059795'

jobs:
  pass:
    runs-on: ubuntu-latest
    name: "Should pass - screenshots are uploaded to the release and posted to the PR"
    # Calls with the same comment-tag must not run in parallel (two pushes in a
    # row would both see no comment and create one each), so runs for one PR queue up.
    concurrency:
      group: release-pr-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The footer of the comment names the commit under review (the PR head),
      # the image file names carry GITHUB_SHA (the merge commit of the PR).
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Remember when this scenario started
        run: echo "SINCE=$(date -u -d '1 minute ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Serve the fixture site
        uses: ./.github/actions/serve-fixtures

      # 1. Default comment options: a closed accordion per capture, sized images,
      #    one comment that later calls edit in place
      - name: Take screenshots and upload them to the release (default comment options)
        uses: ./
        with:
          url: http://localhost:8080/
          devices: iPhone 13,iPad Pro 11 landscape
          release-id: ${{ env.CI_RELEASE_ID }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert the local screenshots
        run: |
          node .github/scripts/assert-screenshots.mjs --title "Release upload" --archive-to artifacts/release-capture --expect-count 9 --expect-from-name 'desktopPage*' --expect 'iPhone_13-*=1170x1992' --expect 'iPad_Pro_11_landscape-*=2388x1668'
      - name: Assert the release assets
        run: bash .github/scripts/assert-release-assets.sh
      - name: Assert the PR comment - closed accordions, sized images, one comment
        run: |
          set -euo pipefail
          files=$(find screenshots -maxdepth 1 -type f | wc -l)
          sha7=$(echo "$GITHUB_SHA" | cut -c1-7)
          tag=$(gh api "repos/$GH_REPO/releases/$CI_RELEASE_ID" --jq .tag_name)
          gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" --jq '.[] | {id, login: .user.login, body} | tojson' > "$RUNNER_TEMP/comments.jsonl"
          node .github/scripts/assert-pr-comment.mjs --comments "$RUNNER_TEMP/comments.jsonl" \
            --title "PR comment (defaults)" --tag screenshots --expect-comments 1 \
            --images "$files" --details-closed --sized-images \
            --contains "/releases/download/$tag/" --contains "-$sha7." --contains "Commit ${HEAD_SHA:0:7}" \
            --not-contains '<details open' \
            --write-body "$RUNNER_TEMP/comment-first.md" --write-id "$RUNNER_TEMP/comment-id"
          echo "COMMENT_ID=$(cat "$RUNNER_TEMP/comment-id")" >> "$GITHUB_ENV"
          bash .github/scripts/assert-image-url.sh "$RUNNER_TEMP/comment-first.md"

      # 2. The same call again: the comment is edited in place, not duplicated
      - name: Take the screenshots again with the same comment tag
        uses: ./
        with:
          url: http://localhost:8080/
          devices: iPhone 13,iPad Pro 11 landscape
          release-id: ${{ env.CI_RELEASE_ID }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert the comment was updated in place (still one comment, same id, new images)
        run: |
          set -euo pipefail
          files=$(find screenshots -maxdepth 1 -type f | wc -l)
          sha7=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" --jq '.[] | {id, login: .user.login, body} | tojson' > "$RUNNER_TEMP/comments.jsonl"
          node .github/scripts/assert-pr-comment.mjs --comments "$RUNNER_TEMP/comments.jsonl" \
            --title "PR comment (second call, same tag)" --tag screenshots --expect-comments 1 --expect-id "$COMMENT_ID" \
            --images "$files" --details-closed --sized-images --contains "-$sha7." \
            --write-body "$RUNNER_TEMP/comment-second.md"
          # The upload names carry a new timestamp, so an edit changes the body
          if cmp -s "$RUNNER_TEMP/comment-first.md" "$RUNNER_TEMP/comment-second.md"; then
            echo "::error::The comment body did not change, it was not edited"
            exit 1
          fi
          {
            echo "- Second call with the same tag edited comment $COMMENT_ID instead of posting another"
          } >> "$GITHUB_STEP_SUMMARY"

      # 3. A tall page, captured in parts, with its own tag so it keeps its own comment
      - name: Remember when the tall page capture started
        run: |
          rm -rf screenshots
          echo "SINCE=$(date -u -d '1 minute ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Upload a tall page, captured in parts, to the release
        uses: ./
        with:
          url: http://localhost:8080/?mode=tall
          no-desktop: true
          devices: iPad Pro 11
          full-page: true
          type: jpeg
          release-id: ${{ env.CI_RELEASE_ID }}
          comment-tag: tall
          comment-headline: Tall page
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert the local parts
        run: |
          node .github/scripts/assert-screenshots.mjs --title "Release upload, tall page" --archive-to artifacts/release-tall --expect-count 3 --max-height 16000 --expect-total-height 40552 --type jpeg
      - name: Assert the release assets
        run: bash .github/scripts/assert-release-assets.sh
      - name: Assert the PR comment with parts, and that the first comment is untouched
        run: |
          set -euo pipefail
          files=$(find screenshots -maxdepth 1 -type f | wc -l)
          sha7=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" --jq '.[] | {id, login: .user.login, body} | tojson' > "$RUNNER_TEMP/comments.jsonl"
          node .github/scripts/assert-pr-comment.mjs --comments "$RUNNER_TEMP/comments.jsonl" \
            --title "PR comment (tall page)" --tag tall --expect-comments 1 --not-id "$COMMENT_ID" \
            --images "$files" --details-closed --sized-images \
            --contains 'part 3 of 3' --contains '3 parts' --contains '### Tall page' --contains "-$sha7." \
            --write-body "$RUNNER_TEMP/comment-tall.md"
          bash .github/scripts/assert-image-url.sh "$RUNNER_TEMP/comment-tall.md"
          node .github/scripts/assert-pr-comment.mjs --comments "$RUNNER_TEMP/comments.jsonl" \
            --title "PR comment (defaults, untouched by the tall call)" --tag screenshots --expect-comments 1 --expect-id "$COMMENT_ID"

      # 4. Links only: a separate comment without embedded images
      - name: Remember when the links capture started
        run: |
          rm -rf screenshots
          echo "SINCE=$(date -u -d '1 minute ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Take a screenshot and post only links
        uses: ./
        with:
          url: http://localhost:8080/
          no-desktop: true
          devices: iPhone 13
          release-id: ${{ env.CI_RELEASE_ID }}
          comment-layout: links
          comment-tag: links
          comment-headline: Links only
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert the release assets
        run: bash .github/scripts/assert-release-assets.sh
      - name: Assert the separate links comment, with no images
        run: |
          set -euo pipefail
          sha7=$(echo "$GITHUB_SHA" | cut -c1-7)
          tag=$(gh api "repos/$GH_REPO/releases/$CI_RELEASE_ID" --jq .tag_name)
          gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" --jq '.[] | {id, login: .user.login, body} | tojson' > "$RUNNER_TEMP/comments.jsonl"
          node .github/scripts/assert-pr-comment.mjs --comments "$RUNNER_TEMP/comments.jsonl" \
            --title "PR comment (links)" --tag links --expect-comments 1 --not-id "$COMMENT_ID" \
            --no-images --contains '### Links only' --contains "](https://github.com/$GH_REPO/releases/download/$tag/" --contains "-$sha7." \
            --not-contains '<details' \
            --write-body "$RUNNER_TEMP/comment-links.md"
          bash .github/scripts/assert-image-url.sh "$RUNNER_TEMP/comment-links.md"
          node .github/scripts/assert-pr-comment.mjs --comments "$RUNNER_TEMP/comments.jsonl" \
            --title "PR comment (defaults, untouched by the links call)" --tag screenshots --expect-comments 1 --expect-id "$COMMENT_ID" --details-closed
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-release-pr-comment
          path: artifacts
          retention-days: 7
          if-no-files-found: warn
      - name: Prune assets older than 30 days once the release nears its asset limit
        if: always()
        run: |
          set -euo pipefail
          # Housekeeping for the shared CI release only (id is the constant above).
          assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$CI_RELEASE_ID/assets" --jq '.[] | [.id, .created_at] | @tsv')
          total=$(echo "$assets" | grep -c . || true)
          if [ "$total" -lt 600 ]; then
            echo "Release has $total assets, nothing to prune"
            exit 0
          fi
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Release has $total assets, pruning those created before $cutoff"
          echo "$assets" | while IFS=$'\t' read -r id created; do
            if [[ "$created" < "$cutoff" ]]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          done
