<!doctype html>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>screenshots fixture - late element</title>
<!-- A spinner is shown for 4 seconds, then replaced by #late, a 3000px high
	block. A screenshot that really waited for #late (visible) or for the
	spinner to be hidden is therefore taller than 3000px with full-page. -->
<style>
  body { margin: 0; }
  #spinner { height: 100px; background: #fde68a; }
  #late { height: 3000px; background: linear-gradient(#bbf7d0, #86efac); }
</style>
<div id="spinner">loading...</div>
<script>
  setTimeout(() => {
    document.querySelector('#spinner').remove();
    const late = document.createElement('div');
    late.id = 'late';
    late.textContent = 'late content';
    document.body.append(late);
  }, 4000);
</script>
