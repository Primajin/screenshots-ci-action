name: "Multi-Device Website Screenshots CI"
description: "Capture desktop and multi-device website screenshots in CI: save as artifacts, post to PR comments, or send to Telegram."
author: "Primajin"
branding:
  icon: 'camera'
  color: 'green'
inputs:
  url:
    required: true
    description: "The website URL you want to screenshot. e.g. https://www.google.com/"
  no-desktop:
    required: false
    description: "Skip the desktop screenshots and capture only the devices and custom sizes. Needs at least one device or size. Use true to switch it on."
    default: false
  devices:
    required: false
    description: "Mobile devices to capture, in addition to the desktop sizes. e.g. iPhone 13,Galaxy S III landscape,iPad Pro 11 landscape. Separate several devices with a comma. Any name from Playwright's device list; append ' landscape' for the landscape orientation. An unknown name fails the run."
    default: ''
  sizes:
    required: false
    description: "Custom capture sizes, comma separated, each WIDTHxHEIGHT[@SCALE][:mobile], e.g. 1440x900,1440x900@2,390x844@3:mobile. WIDTH and HEIGHT are whole numbers from 1 to 10000, SCALE (device scale factor) a number from 0.1 to 5 (default 1), :mobile switches isMobile and hasTouch on. Each size is captured in its own context without a device profile, in addition to the desktop sizes (use no-desktop: true to skip them) and the devices. An invalid entry fails the run."
    default: ''
  full-page:
    required: false
    description: "When true, takes a screenshot of the full scrollable page instead of the viewport. Defaults to false."
    default: false
  full-page-strategy:
    required: false
    description: "Only applies when full-page is true. scroll (default): scroll through the page, then use Chromium's full page capture. grow-viewport: grow the viewport to the height of the page and capture it in slices without Chromium's full page mode, so cross-origin iframes (map embeds) render instead of coming out blank; scroll-before-capture is ignored. Any other value fails the run."
    default: 'scroll'
  scroll-before-capture:
    required: false
    description: "Only applies when full-page is true. Scroll through the whole page before the capture so lazy-loaded and scroll-reveal content is rendered. Default true; false, 0, no and off (any case) switch it off."
    default: true
  max-image-height:
    required: false
    description: "Only applies when full-page is true. Maximum height in OUTPUT pixels (CSS pixels x device scale factor) of one image, 100 to 16000, default and ceiling 16000. A taller page is captured as consecutive parts named <name>-part1, -part2, ... (nothing is stitched, cropped or downscaled); there is no way to get one image above 16000 pixels."
    default: '16000'
  context-options:
    required: false
    description: "JSON object with Playwright browser context options that are applied to every capture, desktop and devices: colorScheme (light, dark, no-preference), reducedMotion (reduce, no-preference), forcedColors (active, none), deviceScaleFactor (number above 0, at most 5), isMobile, hasTouch (booleans), viewport ({width, height} up to 10000, replaces the 7 fixed desktop sizes with this single one), locale (a language tag), timezoneId (an IANA time zone), userAgent. They win over a device's own values; the pre-script session is never overridden. Invalid JSON, an unknown key or a wrong type fails the run. e.g. {\"colorScheme\": \"dark\", \"reducedMotion\": \"reduce\"}"
    default: ''
  status-bar:
    required: false
    description: "none (default), ios or android: draw a MOCK phone status bar (clock, signal, wifi, battery) into the captures that emulate a mobile device (devices with isMobile and sizes entries with :mobile). Other captures ignore it. See README, Phone status bar."
    default: 'none'
  status-bar-time:
    required: false
    description: "The clock of the status bar, H:MM or HH:MM from 0:00 to 23:59. An invalid value fails the run. Defaults to 9:41."
    default: '9:41'
  status-bar-battery:
    required: false
    description: "The battery level of the status bar, a whole number from 0 to 100. An invalid value fails the run. Defaults to 100."
    default: '100'
  status-bar-charging:
    required: false
    description: "Draw the battery of the status bar as charging (green, with a bolt). true or false, defaults to false."
    default: false
  status-bar-theme:
    required: false
    description: "Colour of the glyphs of the status bar: auto (default: dark glyphs, or light ones when context-options sets colorScheme dark), light (light glyphs for a dark page) or dark (dark glyphs for a light page)."
    default: 'auto'
  status-bar-mode:
    required: false
    description: "strip (default): the bar is drawn above the capture and the image grows by the height of the bar (47 CSS px for ios, 24 for android). overlay: the bar is drawn over the top of the capture and the size does not change."
    default: 'strip'
  type:
    required: false
    description: "Screenshot file type: jpeg or png. Defaults to 'jpeg'."
    default: 'jpeg'
  no-commit-hash-file-name:
    required: false
    description: "Leave the commit hash out of the screenshot file names. Defaults to false."
    default: false
  wait-until:
    required: false
    description: "When to consider navigation succeeded: load, domcontentloaded, networkidle or commit. Legacy Puppeteer values networkidle0 and networkidle2 are mapped to networkidle. Defaults to 'networkidle'."
    default: 'networkidle'
  wait-for-selector:
    required: false
    description: "Wait for the selector to be attached to the DOM. Returns immediately if it already exists. If it doesn't appear within the timeout, the error is logged and the screenshot is taken anyway."
    default: ''
  wait-for-selector-hidden:
    required: false
    description: 'Wait for the selected element to not be found in the DOM or to be hidden, i.e. have display: none or visibility: hidden CSS properties. Needs wait-for-selector.'
    default: false
  wait-for-selector-visible:
    required: false
    description: 'Wait for the selected element to be present in DOM and to be visible, i.e. to not have display: none or visibility: hidden CSS properties. Needs wait-for-selector; wins over wait-for-selector-hidden.'
    default: false
  wait-for-selector-timeout:
    required: false
    description: 'Maximum time to wait for the selector in milliseconds. Pass 0 to disable the timeout. Defaults to 30000.'
    default: '30000'
  pre-script-path:
    required: false
    description: "Path (relative to the workspace) to a JavaScript module whose default export is an async function receiving { browser, context, page, url }. It runs once before any screenshot, e.g. to log in or dismiss a cookie banner; cookies and localStorage it sets are reused for every screenshot. See README.pre-script.md."
    default: ''
  pre-script-timeout:
    required: false
    description: "Maximum time in milliseconds the pre-script may run before the action fails. Defaults to 30000."
    default: '30000'
  report-page-problems:
    required: false
    description: "When true, report what the page does wrong while it is captured: uncaught exceptions and console errors (from before the navigation on), and a wait-for-selector that timed out. They are shown as a warning block in the PR comment and as warning annotations of the run (the first 10). It never fails the run. Defaults to false."
    default: false
  release-id:
    required: false
    description: "Id of an existing, published GitHub release (a pre-release is fine) that the screenshots are uploaded to as assets. Needed for the PR comment, see README.PR.md. Also needs the GITHUB_TOKEN env."
    default: ''
  comment:
    required: false
    description: "Post the uploaded screenshots to the pull request comment (needs release-id). false, 0, no and off switch it off: the screenshots are still uploaded to the release, nothing is posted. Default true."
    default: true
  comment-layout:
    required: false
    description: "How the comment shows the screenshots: details (a collapsible section per group, default), inline (a heading per group with the images directly under it) or links (only a list of links, no embedded images). See README, PR comments."
    default: 'details'
  comment-open:
    required: false
    description: "Layout details only: which sections start open. none (default, all closed, so the page does not jump while images load), first or all."
    default: 'none'
  comment-group-by:
    required: false
    description: "How the captures are grouped: capture (one section per desktop size or device, with its parts inside, default), all (a single section with everything) or none (one section per image)."
    default: 'capture'
  comment-image-width:
    required: false
    description: "Widest display width in CSS pixels of an image in the comment. Every image gets width and height attributes from its real size (aspect ratio kept, never enlarged), so the page does not reflow while images load. 0 leaves the attributes out. Default 600."
    default: '600'
  comment-image-height:
    required: false
    description: "auto-ratio (default) puts height next to width on every image, so the page does not jump. none puts only the width: use it if images look squashed in a narrow window (GitHub caps an image at the column width, which a fixed height does not follow)."
    default: 'auto-ratio'
  comment-mode:
    required: false
    description: "update (default) edits the comment this action posted earlier on the pull request (found by comment-tag), new always posts a new comment."
    default: 'update'
  comment-tag:
    required: false
    description: "Identifies the comment for comment-mode update, through a hidden marker line. Use a different tag for every call of this action on the same pull request (calls must not run in parallel with the same tag). Default 'screenshots'."
    default: 'screenshots'
  comment-section:
    required: false
    description: "Name of this call's section, to let several calls share ONE comment (the one of comment-tag): the comment holds one section per name, and a call replaces only its own section and leaves the others as they are. The section is one group titled with the name; the headline and footer are shared (the latest call wins). Empty (default): this call owns the whole comment. Needs comment-mode update. Calls must run one after the other: parallel calls can lose updates. See README, PR comments."
    default: ''
  comment-headline:
    required: false
    description: "Headline of the comment. Default 'Screenshots'."
    default: 'Screenshots'
  comment-footer:
    required: false
    description: "Add a small footer with the commit and a link to the workflow run. false, 0, no and off switch it off. Default true."
    default: true
runs:
  using: 'composite'
  steps:
    - name: Setup Playwright
      uses: Primajin/.github/actions/setup-playwright@e935eed2767688c725dc9dcbbbec1a3be4abf715 # v1.1.0
      with:
        working-directory: ${{ github.action_path }}
        with-deps: true

    - name: Take screenshots
      run: node "${GITHUB_ACTION_PATH}/index.js"
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_NO-DESKTOP: ${{ inputs.no-desktop }}
        INPUT_DEVICES: ${{ inputs.devices }}
        INPUT_SIZES: ${{ inputs.sizes }}
        INPUT_FULL-PAGE: ${{ inputs.full-page }}
        INPUT_FULL-PAGE-STRATEGY: ${{ inputs.full-page-strategy }}
        INPUT_SCROLL-BEFORE-CAPTURE: ${{ inputs.scroll-before-capture }}
        INPUT_MAX-IMAGE-HEIGHT: ${{ inputs.max-image-height }}
        INPUT_CONTEXT-OPTIONS: ${{ inputs.context-options }}
        INPUT_STATUS-BAR: ${{ inputs.status-bar }}
        INPUT_STATUS-BAR-TIME: ${{ inputs.status-bar-time }}
        INPUT_STATUS-BAR-BATTERY: ${{ inputs.status-bar-battery }}
        INPUT_STATUS-BAR-CHARGING: ${{ inputs.status-bar-charging }}
        INPUT_STATUS-BAR-THEME: ${{ inputs.status-bar-theme }}
        INPUT_STATUS-BAR-MODE: ${{ inputs.status-bar-mode }}
        INPUT_TYPE: ${{ inputs.type }}
        INPUT_NO-COMMIT-HASH-FILE-NAME: ${{ inputs.no-commit-hash-file-name }}
        INPUT_WAIT-UNTIL: ${{ inputs.wait-until }}
        INPUT_WAIT-FOR-SELECTOR: ${{ inputs.wait-for-selector }}
        INPUT_WAIT-FOR-SELECTOR-HIDDEN: ${{ inputs.wait-for-selector-hidden }}
        INPUT_WAIT-FOR-SELECTOR-VISIBLE: ${{ inputs.wait-for-selector-visible }}
        INPUT_WAIT-FOR-SELECTOR-TIMEOUT: ${{ inputs.wait-for-selector-timeout }}
        PRE_SCRIPT_PATH: ${{ inputs.pre-script-path }}
        PRE_SCRIPT_TIMEOUT: ${{ inputs.pre-script-timeout }}
        INPUT_REPORT-PAGE-PROBLEMS: ${{ inputs.report-page-problems }}
        INPUT_RELEASE-ID: ${{ inputs.release-id }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT-LAYOUT: ${{ inputs.comment-layout }}
        INPUT_COMMENT-OPEN: ${{ inputs.comment-open }}
        INPUT_COMMENT-GROUP-BY: ${{ inputs.comment-group-by }}
        INPUT_COMMENT-IMAGE-WIDTH: ${{ inputs.comment-image-width }}
        INPUT_COMMENT-IMAGE-HEIGHT: ${{ inputs.comment-image-height }}
        INPUT_COMMENT-MODE: ${{ inputs.comment-mode }}
        INPUT_COMMENT-TAG: ${{ inputs.comment-tag }}
        INPUT_COMMENT-SECTION: ${{ inputs.comment-section }}
        INPUT_COMMENT-HEADLINE: ${{ inputs.comment-headline }}
        INPUT_COMMENT-FOOTER: ${{ inputs.comment-footer }}
