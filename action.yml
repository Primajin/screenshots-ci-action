name: "Multi-Device Website Screenshots CI"
description: "Capture desktop and multi-device website screenshots in CI: save as artifacts, post to PR comments, or send to Telegram."
author: "Primajin"
branding:
  icon: 'camera'
  color: 'green'
inputs:
  url:
    required: true
    description: "The website URL you want to screenshot. e.x.: https://www.google.com/"
  noDesktop:
    required: false
    description: "Not screenshot website's desktop viewpoint"
    default: false
  devices:
    required: false
    description: "Screenshot specific mobile devices viewpoint. e.x.: 'iPhone 13' 'Galaxy S III landscape' 'iPad Pro 11 landscape'. Any name from Playwright's device list."
  fullPage:
    required: false
    description: "When true, takes a screenshot of the full scrollable page. Defaults to false"
    default: false
  scrollBeforeCapture:
    required: false
    description: "Only applies when fullPage is true. Scroll through the whole page before the capture so lazy-loaded and scroll-reveal content is rendered. Default true; false, 0, no and off (any case) switch it off."
    default: true
  maxImageHeight:
    required: false
    description: "Only applies when fullPage is true. Maximum height in OUTPUT pixels (CSS pixels x device scale factor) of one image, 100 to 16000, default and ceiling 16000. A taller page is captured as consecutive parts named <name>-part1, -part2, ... (nothing is stitched, cropped or downscaled); there is no way to get one image above 16000 pixels."
    default: '16000'
  type:
    required: false
    description: "Specify screenshot type, can be either jpeg or png. Defaults to 'jpeg'."
    default: 'jpeg'
  noCommitHashFileName:
    required: false
    description: "Screenshot filename don't include commit hash."
    default: false
  waitUntil:
    required: false
    description: "When to consider navigation succeeded: load, domcontentloaded, networkidle or commit. Legacy Puppeteer values networkidle0 and networkidle2 are mapped to networkidle. Defaults to 'networkidle'."
    default: 'networkidle'
  waitForSelector:
    required: false
    description: "Wait for the selector to be attached to the DOM. Returns immediately if it already exists. If it doesn't appear within the timeout, the error is logged and the screenshot is taken anyway."
    default: ''
  waitForSelectorHidden:
    required: false
    description: 'Wait for the selected element to not be found in the DOM or to be hidden, i.e. have display: none or visibility: hidden CSS properties.'
  waitForSelectorVisible:
    required: false
    description: 'Wait for the selected element to be present in DOM and to be visible, i.e. to not have display: none or visibility: hidden CSS properties.'
  waitForSelectorTimeout:
    required: false
    description: 'Maximum time to wait in milliseconds. Pass 0 to disable timeout.'
  preScriptPath:
    required: false
    description: "Path (relative to the workspace) to a JavaScript module whose default export is an async function receiving { browser, context, page, url }. It runs once before any screenshot, e.g. to log in or dismiss a cookie banner; cookies and localStorage it sets are reused for every screenshot. See README.pre-script.md."
    default: ''
  preScriptTimeout:
    required: false
    description: "Maximum time in milliseconds the pre-script may run before the action fails. Defaults to 30000."
    default: '30000'
  releaseId:
    required: false
    description: "GitHub Release id. Required to upload the screenshots to a PR comment (see README.PR.md)."
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci --omit=dev
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Chromium
      run: npx playwright install --with-deps chromium
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Take screenshots
      run: node "${GITHUB_ACTION_PATH}/index.js"
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_NODESKTOP: ${{ inputs.noDesktop }}
        INPUT_DEVICES: ${{ inputs.devices }}
        INPUT_FULLPAGE: ${{ inputs.fullPage }}
        INPUT_SCROLLBEFORECAPTURE: ${{ inputs.scrollBeforeCapture }}
        INPUT_MAXIMAGEHEIGHT: ${{ inputs.maxImageHeight }}
        INPUT_TYPE: ${{ inputs.type }}
        INPUT_NOCOMMITHASHFILENAME: ${{ inputs.noCommitHashFileName }}
        INPUT_WAITUNTIL: ${{ inputs.waitUntil }}
        INPUT_WAITFORSELECTOR: ${{ inputs.waitForSelector }}
        INPUT_WAITFORSELECTORHIDDEN: ${{ inputs.waitForSelectorHidden }}
        INPUT_WAITFORSELECTORVISIBLE: ${{ inputs.waitForSelectorVisible }}
        INPUT_WAITFORSELECTORTIMEOUT: ${{ inputs.waitForSelectorTimeout }}
        PRE_SCRIPT_PATH: ${{ inputs.preScriptPath }}
        PRE_SCRIPT_TIMEOUT: ${{ inputs.preScriptTimeout }}
        INPUT_RELEASEID: ${{ inputs.releaseId }}